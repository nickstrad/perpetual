services:
  postgres:
    image: ${POSTGRES_IMAGE:?Use make dev-db-up so the committed image pin is loaded}
    environment:
      POSTGRES_USER: perpetual
      POSTGRES_PASSWORD: perpetual-local
      POSTGRES_DB: perpetual
    ports:
      - "127.0.0.1:${PERPETUAL_DEV_PORT:-54329}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    command: ["postgres", "-c", "fsync=on", "-c", "synchronous_commit=on", "-c", "full_page_writes=on"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perpetual -d perpetual"]
      interval: 1s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
